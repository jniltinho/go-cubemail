# go-cubemail — Default Configuration
#
# Generated by: go-cubemail init
#
# Filename contains a Unix timestamp by default (e.g. config_1750945822.toml).
# This file was created in the current directory.
# Edit the values below according to your environment and then run:
#
#     go-cubemail serve
#
# All settings can also be overridden using environment variables with the GORC_ prefix.
# Example: GORC_SERVER_PORT=9000 go-cubemail serve

[server]
host        = "0.0.0.0"
port        = 8080
debug       = false
secret_key  = "change-this-secret-key-32-chars!!"
base_url    = "http://localhost:8080"

# HTTPS (optional)
tls_cert    = ""
tls_key     = ""

[imap]
host            = "mail.example.com"
port            = 993
tls             = true
timeout_sec     = 30
show_host_input = false     # Allow users to type a custom IMAP host at login

[smtp]
host        = "mail.example.com"
port        = 587
starttls    = true
timeout_sec = 30

[database]
driver = "sqlite"          # sqlite | mariadb | mysql | postgres
dsn    = "./data/app.db"
debug  = false             # Log all SQL queries (development only)

# MariaDB / MySQL example:
# driver = "mariadb"
# dsn    = "user:password@tcp(localhost:3306)/go_cubemail?charset=utf8mb4&parseTime=True&loc=Local"

# PostgreSQL example:
# driver = "postgres"
# dsn    = "host=localhost user=go_cubemail password=strongpassword dbname=go_cubemail port=5432 sslmode=disable TimeZone=America/Sao_Paulo"

[session]
name      = "gorc_session"
max_age   = 86400
secure    = false
http_only = true

[ui]
theme           = "larry"
rows_per_page   = 50
timezone        = "America/Sao_Paulo"
date_format     = "02/01/2006"
datetime_format = "02/01/2006 15:04"
compose_html    = true

[upload]
max_size_mb = 25
temp_dir    = "./tmp/uploads"

# Exchange ActiveSync (EAS) — mobile mail/calendar/contacts sync
# Endpoints: /Microsoft-Server-ActiveSync, /autodiscover/autodiscover.xml
# Auth: HTTP Basic (validated against IMAP on every request)
[activesync]
enabled               = true
debug                 = false
max_ping_interval_sec = 30
max_sync_window_size  = 100
protocol_version      = "16.1"

# Web Push (browser notifications) — optional
# Generate a VAPID key pair with:
#   npx web-push generate-vapid-keys
# Then paste the output below and run: go-cubemail migrate
[push]
vapid_public_key  = ""
vapid_private_key = ""
vapid_contact     = "mailto:admin@example.com"
