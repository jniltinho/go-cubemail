basePath: /api/v1
definitions:
  handler.attendeeRequest:
    properties:
      email:
        type: string
      name:
        type: string
      partstat:
        type: string
      role:
        type: string
      rsvp:
        type: boolean
    type: object
  handler.attendeeResponse:
    properties:
      email:
        type: string
      name:
        type: string
      partstat:
        type: string
      role:
        type: string
      rsvp:
        type: boolean
    type: object
  handler.calendarActivationRequest:
    properties:
      active:
        type: boolean
      ids:
        items:
          type: integer
        type: array
    type: object
  handler.calendarListResponse:
    properties:
      calendars:
        items:
          $ref: '#/definitions/handler.calendarResponse'
        type: array
    type: object
  handler.calendarRequest:
    properties:
      color:
        type: string
      include_in_free_busy:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    type: object
  handler.calendarResponse:
    properties:
      color:
        type: string
      id:
        type: integer
      include_in_free_busy:
        type: boolean
      is_active:
        type: boolean
      is_default:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    type: object
  handler.contactRequest:
    properties:
      company:
        type: string
      email:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      title:
        type: string
    type: object
  handler.contactResponse:
    properties:
      company:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      title:
        type: string
    type: object
  handler.eventListResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/handler.eventResponse'
        type: array
    type: object
  handler.eventMoveRequest:
    properties:
      calendar_id:
        type: integer
      end_at:
        type: string
      start_at:
        type: string
    type: object
  handler.eventRequest:
    properties:
      attendees:
        items:
          $ref: '#/definitions/handler.attendeeRequest'
        type: array
      calendar_id:
        type: integer
      categories:
        type: string
      classification:
        type: string
      description:
        type: string
      end_at:
        type: string
      is_all_day:
        type: boolean
      is_transparent:
        type: boolean
      location:
        type: string
      organizer_email:
        type: string
      organizer_name:
        type: string
      priority:
        type: integer
      rrule:
        type: string
      start_at:
        type: string
      status:
        type: string
      summary:
        type: string
    type: object
  handler.eventResponse:
    properties:
      attendees:
        items:
          $ref: '#/definitions/handler.attendeeResponse'
        type: array
      calendar_id:
        type: integer
      categories:
        type: string
      classification:
        type: string
      color:
        type: string
      description:
        type: string
      end_at:
        type: string
      id:
        type: integer
      is_all_day:
        type: boolean
      is_recurring:
        type: boolean
      is_transparent:
        type: boolean
      location:
        type: string
      organizer_email:
        type: string
      organizer_name:
        type: string
      priority:
        type: integer
      rrule:
        type: string
      start_at:
        type: string
      status:
        type: string
      summary:
        type: string
      uid:
        type: string
    type: object
  handler.identityRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      is_default:
        type: boolean
      reply_to:
        type: string
      signature:
        type: string
    type: object
  handler.identityResponse:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      reply_to:
        type: string
      signature:
        type: string
    type: object
  handler.settingsRequest:
    properties:
      compose_html:
        type: boolean
      date_format:
        type: string
      oof_enabled:
        type: boolean
      oof_message:
        type: string
      rows_per_page:
        type: integer
      signature_pos:
        type: string
      timezone:
        type: string
    type: object
  handler.settingsResponse:
    properties:
      compose_html:
        type: boolean
      date_format:
        type: string
      oof_enabled:
        type: boolean
      oof_message:
        type: string
      rows_per_page:
        type: integer
      signature_pos:
        type: string
      timezone:
        type: string
    type: object
  handler.shareRequest:
    properties:
      can_write:
        type: boolean
      email:
        type: string
    type: object
  handler.shareResponse:
    properties:
      calendar_id:
        type: integer
      calendar_name:
        type: string
      can_write:
        type: boolean
      id:
        type: integer
      shared_with:
        type: string
    type: object
  handler.subscribePayload:
    properties:
      endpoint:
        type: string
      keys:
        properties:
          auth:
            type: string
          p256dh:
            type: string
        type: object
    type: object
  handler.subscriptionRequest:
    properties:
      color:
        type: string
      name:
        type: string
      refresh_mins:
        type: integer
      url:
        type: string
    type: object
  handler.subscriptionResponse:
    properties:
      calendar_id:
        type: integer
      color:
        type: string
      id:
        type: integer
      last_error:
        type: string
      last_synced_at:
        type: string
      name:
        type: string
      refresh_mins:
        type: integer
      url:
        type: string
    type: object
  imap.MailboxInfo:
    properties:
      delim:
        type: string
      depth:
        description: nesting level (0 = top-level)
        type: integer
      displayName:
        description: last path segment (used for tree display)
        type: string
      hasChildren:
        description: true if at least one subfolder exists under this folder
        type: boolean
      iconType:
        description: '"inbox" | "drafts" | "sent" | "trash" | "junk" | "folder"'
        type: string
      isSystem:
        description: true for INBOX, Sent, Drafts, Trash — cannot be renamed or deleted
        type: boolean
      isTrash:
        type: boolean
      messages:
        format: int32
        type: integer
      name:
        type: string
      noSelect:
        description: true when the folder is a hierarchy placeholder (\Noselect)
        type: boolean
      paddingLeft:
        description: left-padding in px for tree indentation in the UI
        type: integer
      parentName:
        description: full name of the parent folder; empty for top-level
        type: string
      unseen:
        format: int32
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Self-hosted webmail application API backed by IMAP and SMTP.
  title: Go-Cubemail API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Logs in a user using their IMAP credentials and sets a secure session
        cookie.
      parameters:
      - description: Email address of the user
        in: formData
        name: username
        required: true
        type: string
      - description: Password of the user
        in: formData
        name: password
        required: true
        type: string
      - description: Optional custom IMAP host (defaults to server config)
        in: formData
        name: imap_host
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success response containing username
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Required parameters missing or too long
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials or IMAP server unreachable
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Session error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate user
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the user's active session and deletes the session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Success status
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Log out user
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the active session username and global UI date/time format.
      produces:
      - application/json
      responses:
        "200":
          description: Session details containing username and datetime_format
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Current user profile
      tags:
      - auth
  /auth/quota:
    get:
      description: Fetches the user's active IMAP mailbox storage usage and limit
        in bytes.
      produces:
      - application/json
      responses:
        "200":
          description: Quota details containing used and limit bytes
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      security:
      - CookieAuth: []
      summary: IMAP storage quota
      tags:
      - auth
  /calendar:
    get:
      description: Returns all calendars for the authenticated user. Creates a default
        "Personal" calendar on first access.
      produces:
      - application/json
      responses:
        "200":
          description: calendars list
          schema:
            $ref: '#/definitions/handler.calendarListResponse'
        "500":
          description: database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List calendars
      tags:
      - calendar
    post:
      consumes:
      - application/json
      description: 'Creates a new calendar. Color defaults to #3788d8 when omitted.'
      parameters:
      - description: Calendar data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.calendarRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created calendar
          schema:
            $ref: '#/definitions/handler.calendarResponse'
        "400":
          description: name required or invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create calendar
      tags:
      - calendar
  /calendar/{id}:
    delete:
      description: Removes a calendar and all its events. The default calendar cannot
        be deleted.
      parameters:
      - description: Calendar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid id or cannot delete default
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete calendar
      tags:
      - calendar
    put:
      consumes:
      - application/json
      description: Updates an existing calendar. Only provided fields are changed.
      parameters:
      - description: Calendar ID
        in: path
        name: id
        required: true
        type: integer
      - description: Calendar data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.calendarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: updated calendar
          schema:
            $ref: '#/definitions/handler.calendarResponse'
        "400":
          description: invalid id or body
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Update calendar
      tags:
      - calendar
  /calendar/{id}/export:
    get:
      description: Streams all events in the calendar as a downloadable calendar.ics
        file.
      parameters:
      - description: Calendar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/calendar
      responses:
        "200":
          description: ICS file download
          schema:
            type: file
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Export calendar as ICS
      tags:
      - calendar
  /calendar/{id}/import:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a multipart ICS file upload and upserts events by UID.
        Returns imported/updated/skipped counts.
      parameters:
      - description: Calendar ID
        in: path
        name: id
        required: true
        type: integer
      - description: ICS file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: imported, updated, skipped counts
          schema:
            additionalProperties: true
            type: object
        "400":
          description: no file, parse error, or invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: calendar not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Import calendar from ICS
      tags:
      - calendar
  /calendar/{id}/shares:
    get:
      description: Returns all shares for the specified calendar owned by the authenticated
        user.
      parameters:
      - description: Calendar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: shares list
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: calendar not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List calendar shares
      tags:
      - calendar
    post:
      consumes:
      - application/json
      description: Grants another user access to the specified calendar, optionally
        with write permission.
      parameters:
      - description: Calendar ID
        in: path
        name: id
        required: true
        type: integer
      - description: Grantee email and permissions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.shareRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created share
          schema:
            $ref: '#/definitions/handler.shareResponse'
        "400":
          description: invalid body, user not found, or self-share
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: calendar not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Share calendar
      tags:
      - calendar
  /calendar/{id}/shares/{shareId}:
    delete:
      description: Revokes a previously granted calendar share.
      parameters:
      - description: Calendar ID
        in: path
        name: id
        required: true
        type: integer
      - description: Share ID
        in: path
        name: shareId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid shareId
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: share not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Remove calendar share
      tags:
      - calendar
  /calendar/activation:
    post:
      consumes:
      - application/json
      description: Sets the is_active flag for multiple calendars at once. Hidden
        calendars are excluded from the event view.
      parameters:
      - description: IDs and active flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.calendarActivationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ids required or invalid body
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Toggle calendar visibility
      tags:
      - calendar
  /calendar/subscriptions:
    get:
      description: Returns all remote ICS subscriptions for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: subscriptions list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List calendar subscriptions
      tags:
      - calendar
    post:
      consumes:
      - application/json
      description: Stores a remote ICS URL subscription and triggers an immediate
        background fetch to validate and import events.
      parameters:
      - description: Subscription data (url, name, color, refresh_mins)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.subscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created subscription
          schema:
            $ref: '#/definitions/handler.subscriptionResponse'
        "400":
          description: url required or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Subscribe to remote calendar
      tags:
      - calendar
  /calendar/subscriptions/{id}:
    delete:
      description: Deletes a remote ICS calendar subscription.
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Remove calendar subscription
      tags:
      - calendar
  /calendar/subscriptions/{id}/refresh:
    post:
      description: Triggers an immediate background re-fetch and import of the remote
        ICS calendar.
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: status refreshing
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Refresh calendar subscription
      tags:
      - calendar
  /compose/draft:
    post:
      description: Saves an email draft (currently a stub; returns ok immediately).
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Save draft
      tags:
      - compose
  /compose/send:
    post:
      consumes:
      - multipart/form-data
      description: Composes and delivers an email via SMTP, then saves a copy to the
        Sent folder.
      parameters:
      - description: Sender email (defaults to session user)
        in: formData
        name: from_email
        type: string
      - description: Sender display name
        in: formData
        name: from_name
        type: string
      - description: Comma-separated recipient list
        in: formData
        name: to
        required: true
        type: string
      - description: Comma-separated CC list
        in: formData
        name: cc
        type: string
      - description: Comma-separated BCC list
        in: formData
        name: bcc
        type: string
      - description: Email subject
        in: formData
        name: subject
        required: true
        type: string
      - description: HTML body
        in: formData
        name: body_html
        type: string
      - description: Plain-text body
        in: formData
        name: body_plain
        type: string
      - description: Reply-To address
        in: formData
        name: reply_to
        type: string
      - description: File attachments
        in: formData
        name: attachments
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: status sent
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: SMTP delivery error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Send email
      tags:
      - compose
  /compose/upload:
    post:
      consumes:
      - multipart/form-data
      description: Pre-uploads an attachment for use in a composed email (currently
        a stub).
      produces:
      - application/json
      responses:
        "200":
          description: files list (empty)
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Upload attachment
      tags:
      - compose
  /contacts:
    get:
      description: Returns all contacts for the authenticated user, ordered by name.
      produces:
      - application/json
      responses:
        "200":
          description: list of contacts
          schema:
            items:
              $ref: '#/definitions/handler.contactResponse'
            type: array
        "500":
          description: database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List contacts
      tags:
      - contacts
    post:
      consumes:
      - application/json
      description: Adds a new contact. Both name and email are required.
      parameters:
      - description: Contact data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.contactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created contact
          schema:
            $ref: '#/definitions/handler.contactResponse'
        "400":
          description: name and email required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Create contact
      tags:
      - contacts
  /contacts/{id}:
    delete:
      description: Permanently removes a contact by ID.
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete contact
      tags:
      - contacts
    put:
      consumes:
      - application/json
      description: Replaces all fields of an existing contact identified by :id.
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      - description: Contact data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.contactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: updated contact
          schema:
            $ref: '#/definitions/handler.contactResponse'
        "400":
          description: invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Update contact
      tags:
