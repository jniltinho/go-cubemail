name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for (e.g. v0.0.21)'
        required: true
        default: 'v0.0.21'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Set timezone to America/Sao_Paulo
        run: sudo timedatectl set-timezone America/Sao_Paulo
      - name: Verify timezone change
        run: timedatectl && date

      - name: Determine Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Archive name without leading v (e.g. go-cubemail_0.0.22_linux_amd64.tar.gz)
          ARCHIVE_VERSION="${VERSION#v}"
          echo "ARCHIVE_NAME=go-cubemail_${ARCHIVE_VERSION}_linux_amd64.tar.gz" >> $GITHUB_ENV
          echo "Building release for: $VERSION"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx rpm

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Install Go Dependencies
        run: make deps

      - name: Build Application
        run: make all

      - name: Package Binary
        run: |
          cd bin && tar -czvf "../$ARCHIVE_NAME" go-cubemail && cd ..

      # - name: Build Deb Package
      #   run: make deb

      # - name: Build RPM Package
      #   run: make rpm

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            ${{ env.ARCHIVE_NAME }}
            # go-cubemail_*.deb
            # *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
